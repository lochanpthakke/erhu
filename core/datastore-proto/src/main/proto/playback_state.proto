syntax = "proto3";

option java_package = "com.lochanpthakke.empee3.core.datastore.proto";
option java_multiple_files = true;

enum AnimatedArtOrientationProto {
  SQUARE_1_1 = 0;
  TALL_3_4 = 1;
}

message PlaybackStateProto {
  repeated int64 queue_song_ids = 1;
  int32 current_index = 2;
  int64 position_ms = 3;
  bool shuffle_mode_enabled = 4;
  RepeatModeProto repeat_mode = 5;
  string app_theme_id = 6;
  string widget_theme_id = 7;
  bool is_dark_mode = 8;
  string library_layout_mode = 9;
  string last_verified_stable_theme_id = 10;
  string last_verified_stable_checksum = 11;
  bool theme_rollback_flag = 12;
  // Absent until the user changes a sound setting; absence means "use defaults".
  SoundSettingsProto sound_settings = 13;
  // 14 was used by an unreleased development build.
  reserved 14;
  // Glass material on floating surfaces, independent of the theme. Unset = off.
  optional bool glass_effect_enabled = 15;
  string custom_scan_location_uri = 16;
  string custom_scan_location_path = 17;
  bool is_custom_scan_location_enabled = 18;
  bool scan_location_configured = 19;
  string default_start_section = 20;
  // Absent until the user changes a visualizer preference; absence means "use defaults".
  VisualizerSettingsProto visualizer_settings = 21;
  // Per-album / per-playlist transition settings, keyed by "album:<id>" or "playlist:<id>".
  // A collection without an entry uses the defaults (transitions off).
  map<string, CollectionTransitionProto> collection_transitions = 22;
  // The collection (and occurrence) each queue entry was started from, parallel to queue_song_ids
  // ("" = none), e.g. "playlist:5#s12@3".
  repeated string queue_collection_keys = 23;
  // Per-transition overrides, keyed "<collection>|<from occurrence>><to occurrence>". Absent = inherit.
  map<string, CollectionTransitionProto> pair_transitions = 24;
  // App-wide master switch and default. Absent = defaults (master on, default off).
  GlobalTransitionProto global_transitions = 25;
  // Metadata & Artwork: provider ("ALL", "MusicBrainz", "Deezer") and MetadataFixAction name.
  // Empty = defaults (all providers, all fields).
  string metadata_provider = 26;
  string metadata_fix_action = 27;
  // The metadata editor's repair queue, so a batch interrupted by a lost connection or a closed
  // app can be resumed. Absent / empty = no batch.
  RepairBatchProto repair_batch = 28;
  // Score a metadata match needs to be written automatically (0.50–0.95). 0 = default (0.85).
  float metadata_confidence_threshold = 29;
  // User-supplied Fanart.tv personal API key for high-resolution artist thumbs and backgrounds.
  string fanart_tv_api_key = 30;
  // Glassyness / frostiness level sliders (0.0 = clear glass, 1.0 = full frosted glass).
  float sidebar_glassyness = 31;
  float ui_glassyness = 32;
  // User preference for animated artwork
  AnimatedArtOrientationProto animated_art_orientation = 33;
}

message RepairBatchProto {
  repeated RepairItemProto items = 1;
  // Why the batch stopped before finishing ("" = it didn't).
  string pause_reason = 2;
}

// One queued track: its song id, status name (PENDING, DONE, NETWORK_FAILED…) and the reason shown.
message RepairItemProto {
  int64 song_id = 1;
  string status = 2;
  string reason = 3;
}

message GlobalTransitionProto {
  optional bool master_enabled = 1;
  // "OFF" or "CUSTOM" (with default_spec).
  string default_mode = 2;
  TransitionSpecProto default_spec = 3;
}

// A transition exactly as the engine plays it. Enum names are strings; unknown values fall back.
message TransitionSpecProto {
  int32 duration_ms = 1;
  string preset = 2;
  string curve = 3;
  // Custom curves: parallel time / gain lists.
  repeated float out_t = 4;
  repeated float out_gain = 5;
  repeated float in_t = 6;
  repeated float in_gain = 7;
  bool bass_swap = 8;
  float bass_swap_at = 9;
  // TransitionFilter name; empty / unknown = no filter.
  string filter = 10;
  // Cue points of a pair: ms skipped at the outgoing track's end, and where the incoming track starts.
  int32 outgoing_cut_ms = 11;
  int32 incoming_start_ms = 12;
}

// Curve names are stored as strings, so unknown values from other versions fall back to defaults.
// Used for collections and for pairs. Version 1 had only enabled / duration_ms / curve
// (enabled = a crossfade with those values, otherwise inherit); version 2 uses mode and spec.
message CollectionTransitionProto {
  bool enabled = 1;
  int32 duration_ms = 2;
  string curve = 3;
  int32 schema_version = 4;
  // "INHERIT", "OFF" or "CUSTOM" (version 2).
  string mode = 5;
  TransitionSpecProto spec = 6;
}

// Enum names are stored as strings, so unknown values from other versions fall back to defaults.
message VisualizerSettingsProto {
  string mode = 1;
  string sensitivity = 2;
  string smoothing = 3;
  bool reduce_motion = 4;
}

message EqPresetProto {
  string id = 1;
  string name = 2;
  repeated float band_gains = 3;
  repeated float band_frequencies = 4;
  repeated float band_qs = 5;
  repeated string filter_types = 6;
}

message SoundSettingsProto {
  bool eq_enabled = 1;
  repeated float band_gains = 2;
  string active_preset_id = 3;
  repeated EqPresetProto custom_presets = 4;
  bool bass_boost_enabled = 5;
  int32 bass_boost_strength = 6;
  bool virtualizer_enabled = 7;
  int32 virtualizer_strength = 8;
  bool loudness_enabled = 9;
  int32 loudness_gain_mb = 10;
  repeated float band_frequencies = 11;
  repeated float band_qs = 12;
  repeated string filter_types = 13;
  int32 active_band_count = 14;
  int32 selected_band_index = 15;
}

enum RepeatModeProto {
  REPEAT_MODE_OFF = 0;
  REPEAT_MODE_ONE = 1;
  REPEAT_MODE_ALL = 2;
}
