<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>erhu announcements</title><link rel="stylesheet" href="style.css"><script src="admin.js" defer></script></head><body><main><header><h1>erhu announcements</h1><p>Publish notices without shipping another app version.</p></header><section id="login"><h2>Administrator sign-in</h2><form id="sign-in"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button>Sign in</button></form></section><section id="editor" hidden><div class="toolbar"><h2>Announcement</h2><button id="new" type="button">New announcement</button><button id="sign-out" type="button">Sign out</button></div><form id="announcement"><input name="id" type="hidden"><label>Title<input name="title" maxlength="120" required></label><label>Message<textarea name="body" maxlength="4000" rows="5" required></textarea></label><label>Type<select name="type"><option value="general">General announcement</option><option value="feature">New feature</option><option value="important_update">Important update</option><option value="maintenance">Maintenance</option></select></label><label>Optional image URL<input name="imageUrl" type="url" placeholder="HTTPS image URL"></label><div class="columns"><label>Action label<input name="actionLabel" maxlength="60"></label><label>Action destination<input name="actionUrl" type="url" placeholder="HTTPS URL"></label></div><div class="columns"><label>Publish at<input name="publishedAt" type="datetime-local" required></label><label>Expire at<input name="expiresAt" type="datetime-local" required></label></div><p>Use the current time for immediate publication, or a future time to schedule.</p><div class="columns"><label>Minimum versionCode<input name="minVersionCode" type="number" min="1"></label><label>Maximum versionCode<input name="maxVersionCode" type="number" min="1"></label><label>Minimum versionName<input name="minVersionName" placeholder="1.0.3"></label><label>Maximum versionName<input name="maxVersionName" placeholder="1.0.9"></label></div><label class="check"><input name="active" type="checkbox" checked>Active</label><label>Audience<select name="audience"><option value="test">One test device</option><option value="all">All subscribed devices</option></select></label><label id="token-field">Test device FCM registration token<input name="testToken" autocomplete="off"></label><button id="save">Publish to test device</button></form><h2>Existing announcements</h2><button id="refresh" type="button">Refresh</button><div id="items"></div></section><p id="status" role="status"></p></main></body></html>
