naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    ignoreAnnotated: ['Composable']
    excludes: ['**/ui/theme/Color.kt', '**/test/**', '**/androidTest/**']

complexity:
  LongParameterList:
    functionThreshold: 10
    constructorThreshold: 25
  TooManyFunctions:
    thresholdInClasses: 30
    thresholdInInterfaces: 30
    thresholdInObjects: 30
    thresholdInEnums: 30