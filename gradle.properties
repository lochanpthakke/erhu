# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# Increased memory and G1GC eliminate GC thrashing during multi-module compilation.
org.gradle.jvmargs=-Xmx4096m -XX:+UseG1GC -Dfile.encoding=UTF-8

# Enable parallel multi-project compilation across available CPU cores.
org.gradle.parallel=true

# When enabled, the Configuration Cache allows Gradle to skip the configuration phase.
org.gradle.configuration-cache=true

# Enable KSP & Kotlin Incremental Caching
ksp.incremental=true
kotlin.incremental=true
kotlin.caching.enabled=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
org.gradle.tooling.parallel=true

# Required until KSP supports AGP 9's built-in Kotlin (tracked: github.com/google/ksp/issues/2615)
android.disallowKotlinSourceSets=false
