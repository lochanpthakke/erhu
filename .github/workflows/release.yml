name: erhu Metadata Debug Build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: erhu-metadata-debug-${{ github.ref }}
  cancel-in-progress: false
jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ERHU_FIREBASE_APP_ID: ${{ vars.ERHU_FIREBASE_APP_ID }}
      ERHU_FIREBASE_API_KEY: ${{ vars.ERHU_FIREBASE_API_KEY }}
      ERHU_FIREBASE_PROJECT_ID: ${{ vars.ERHU_FIREBASE_PROJECT_ID }}
      ERHU_FIREBASE_SENDER_ID: ${{ vars.ERHU_FIREBASE_SENDER_ID }}
      ERHU_ANNOUNCEMENTS_URL: ${{ vars.ERHU_ANNOUNCEMENTS_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
      - name: Regression tests and isolated debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :core:sound:testDebugUnitTest :core:datastore:testDebugUnitTest \
            :core:playback:testDebugUnitTest :feature:library:testDebugUnitTest :feature:settings:testDebugUnitTest \
            :app:assembleDebug -PbenchApp -PtargetAbi=arm64-v8a --no-configuration-cache --max-workers=2 \
            -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" --console=plain
      - name: Verify APK and retain checksums
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, shutil, subprocess, zipfile
          from pathlib import Path
          apks = list(Path('app/build/outputs/apk').rglob('*.apk'))
          assert len(apks) == 1, [str(p) for p in apks]
          apk = apks[0]
          assert apk.stat().st_size > 1024 * 1024
          tools = Path(os.environ['ANDROID_HOME']) / 'build-tools/36.0.0'
          badging = subprocess.check_output([str(tools/'aapt'), 'dump', 'badging', str(apk)], text=True)
          match = re.search(r"package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'", badging)
          assert match, 'APK identity unavailable'
          package, code, name = match.groups()
          assert package == 'com.lochanpthakke.empee3.bench', package
          gradle = Path('app/build.gradle.kts').read_text()
          assert int(code) == int(re.search(r'versionCode = (\d+)', gradle).group(1))
          assert name == re.search(r'versionName = "([^"]+)"', gradle).group(1)
          signing = subprocess.check_output([str(tools/'apksigner'), 'verify', '--verbose', '--print-certs', str(apk)], text=True)
          certificate = re.search(r'certificate SHA-256 digest: ([0-9a-f]+)', signing).group(1)
          with zipfile.ZipFile(apk) as archive:
              abis = {p.split('/')[1] for p in archive.namelist() if p.startswith('lib/') and p.endswith('.so')}
          assert abis == {'arm64-v8a'}, abis
          out = Path('debug-artifact'); out.mkdir()
          target = out/'erhu-metadata-debug-arm64.apk'
          shutil.copy2(apk, target)
          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          Path(str(target)+'.sha256').write_text(digest+'  '+target.name+'\n')
          verification = dict(commit=os.environ['GITHUB_SHA'], package=package, version_name=name, version_code=int(code),
              variant='debug', isolated=True, abi='arm64-v8a', sha256=digest, certificate_sha256=certificate)
          (out/'verification.json').write_text(json.dumps(verification, indent=2)+'\n')
          print(json.dumps(verification))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: erhu-metadata-debug-${{ github.run_id }}
          path: debug-artifact/*
          if-no-files-found: error
          retention-days: 14
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erhu-metadata-tests-${{ github.run_id }}
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            core/sound/build/test-results/testDebugUnitTest/*.xml
            core/datastore/build/test-results/testDebugUnitTest/*.xml
            core/playback/build/test-results/testDebugUnitTest/*.xml
            feature/library/build/test-results/testDebugUnitTest/*.xml
            feature/settings/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
          retention-days: 14
